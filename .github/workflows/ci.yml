name: CI & Golden Eval Gate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SDK & Run Unit + Golden Benchmarks
        run: |
          pip install -e .
          python -m unittest discover -s tests -v
          python benchmarks/run_golden_eval.py
