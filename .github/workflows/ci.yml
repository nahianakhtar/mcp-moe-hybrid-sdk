name: CI & Golden Eval Gate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install SDK & Dev Tools
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Lint (ruff)
        run: .venv/bin/ruff check .
      - name: Test Suite (pytest)
        run: PYTHONPATH=src .venv/bin/pytest -q
      - name: Golden Evaluation Benchmark
        run: PYTHONPATH=src .venv/bin/python benchmarks/run_golden_eval.py
